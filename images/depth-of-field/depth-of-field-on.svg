<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.6" stop-color="#2d2640"/>
      <stop offset="1" stop-color="#1a1425"/>
    </linearGradient>
    <filter id="blurNear" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurFar" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="280" cy="420" r="140" fill="#7c3aed" filter="url(#blurNear)"/>
  <circle cx="640" cy="360" r="90"  fill="#a78bfa"/>
  <circle cx="970" cy="320" r="55"  fill="#c4b5fd" filter="url(#blurFar)"/>
  <text x="50%" y="92%" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="22" letter-spacing="2">PLACEHOLDER — DEPTH OF FIELD ON</text>
</svg>
